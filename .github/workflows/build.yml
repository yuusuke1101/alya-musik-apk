name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlyaMusic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlyaMusic-apk
          path: AlyaMusic.apk
      - name: Terbitkan rilis (dipakai untuk pemberitahuan update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" AlyaMusic.apk --title "Alya Music v${{ github.run_number }}" --generate-notes || gh release upload "v${{ github.run_number }}" AlyaMusic.apk --clobber
