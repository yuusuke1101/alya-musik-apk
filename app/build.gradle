plugins {
    id 'com.android.application'
}
def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
def autoVersionCode = githubRunNumber.toInteger()
def autoVersionName = "v" + githubRunNumber

android {
    namespace 'com.alya.music'
    compileSdk 34
    
    buildFeatures {
        buildConfig = true
    }
    
    defaultConfig {
        applicationId 'com.alya.music'
        minSdk 24
        targetSdk 34
        
        versionCode autoVersionCode
        versionName autoVersionName
        
        buildConfigField "String", "REPO", "\"yuusuke1101/alya-musik-apk\""
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'
}
